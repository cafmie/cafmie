<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>img to 3D</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/vendor/model-viewer.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>img to 3D</h1>
        <p>写真1枚を、このPCの中だけで立体モデルにします</p>
      </div>
    </div>
    <p class="status" id="status" role="status">準備しています</p>
  </header>

  <main>
    <section class="panel" aria-label="変換の設定">
      <div class="drop" id="drop">
        <label class="drop-copy" id="dropCopy">
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp">
          <strong>画像をドロップ</strong>
          <span>クリックして選択、または貼り付け</span>
        </label>
        <div class="frame" id="frame" hidden>
          <img id="preview" alt="">
          <canvas id="objectLayer" hidden aria-hidden="true"></canvas>
        </div>
      </div>
      <button class="text-button" id="replace" type="button" hidden>別の画像を選ぶ</button>
      <button class="text-button" id="sample" type="button">サンプルのお城で試す</button>
      <p class="credit">サンプル写真は<a href="https://www.free-materials.com/%E3%83%A1%E3%83%AB%E3%83%98%E3%83%B3%E3%83%BB%E3%81%8A%E5%9F%8E02/" target="_blank" rel="noopener noreferrer">フリー素材ドットコム「メルヘン・お城02」</a>です。</p>
      <div class="objects" id="objects" hidden>
        <p id="objectsText"></p>
        <div class="object-choices" id="objectChoices"></div>
      </div>

      <fieldset class="modes">
        <legend>形</legend>
        <label><input type="radio" name="mode" value="volume" checked> 立体</label>
        <label><input type="radio" name="mode" value="relief"> レリーフ</label>
      </fieldset>
        <p class="hint" id="modeHint">表に写真の凹凸と細部、裏になめらかな厚みを付けた立体です。</p>

      <label class="check">
        <input id="cutout" type="checkbox" checked>
        背景を切り抜く
      </label>

      <div class="sliders">
        <label>
          <span>奥行き <b id="depthValue">0.22</b></span>
          <input id="depth" type="range" min="0" max="1.2" step="0.01" value="0.22">
        </label>
        <label>
          <span>ふくらみ <b id="inflateValue">0.46</b></span>
          <input id="inflate" type="range" min="0" max="0.8" step="0.01" value="0.46">
        </label>
        <label id="thicknessField">
          <span>台の厚み <b id="thicknessValue">0.08</b></span>
          <input id="thickness" type="range" min="0.02" max="0.4" step="0.01" value="0.08">
        </label>
        <label>
          <span>なめらかさ <b id="smoothValue">1.0</b></span>
          <input id="smooth" type="range" min="0" max="3" step="0.1" value="1">
        </label>
        <label>
          <span>密度 <b id="resolutionValue">512</b></span>
          <input id="resolution" type="range" min="192" max="768" step="32" value="512">
        </label>
        <label>
          <span>細部 <b id="detailValue">0.85</b></span>
          <input id="detail" type="range" min="0" max="1.5" step="0.05" value="0.85">
        </label>
      </div>

      <button class="go" id="go" type="button" disabled>3Dモデルを作る</button>
      <p class="fine">処理はネットワークに画像を送らず、このPCの中で完結します。深度と切り抜きは GPU があればそこで計算します。細部は写真のきめを表面の凹凸にします。見えない裏側はなめらかな殻のままです。初回だけモデルを取得します。</p>

      <div class="install" id="install">
        <p id="installText">インストール状態を確認しています</p>
        <button class="text-button" id="installButton" type="button">このPCにインストール</button>
      </div>

      <p class="error" id="error" hidden></p>

      <div class="result" id="result" hidden>
        <p class="stats" id="stats"></p>
        <p class="notice" id="notice" hidden></p>
        <div class="downloads">
          <a id="glb" download="model.glb">GLB</a>
          <a id="stl" download="model.stl">STL</a>
          <a id="zip" download="model-obj.zip">OBJ</a>
        </div>
        <div class="thumbs">
          <figure>
            <img id="depthThumb" alt="推定した奥行き">
            <figcaption>奥行き</figcaption>
          </figure>
          <figure>
            <img id="maskThumb" alt="切り抜いた輪郭">
            <figcaption>輪郭</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="stage" aria-label="3Dプレビュー">
      <div class="empty" id="empty">
        <svg viewBox="0 0 120 80" aria-hidden="true">
          <rect x="8" y="18" width="46" height="36" rx="2"></rect>
          <path d="M62 40h18"></path>
          <path d="M74 34l8 6-8 6"></path>
          <path d="M96 22l14 8v22l-14 8-14-8V30z"></path>
        </svg>
        <p>できたモデルはここで回せます</p>
      </div>
      <model-viewer
        id="viewer"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        auto-rotate-delay="700"
        rotation-per-second="16deg"
        shadow-intensity="0.28"
        shadow-softness="1"
        exposure="1.08"
        interaction-prompt="none"
        alt="生成した3Dモデル"
        hidden>
      </model-viewer>
      <div class="working" id="working" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p id="workingText">立体にしています</p>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
